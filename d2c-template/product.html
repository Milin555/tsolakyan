<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product — VedoraKids</title>
<meta name="description" content="Ethnic wear for children. Size, colour, fabric and care details.">
<meta name="theme-color" content="#2B2724">
<meta property="og:type" content="product">
<meta property="og:title" content="VedoraKids">
<meta property="og:description" content="Ethnic wear for children.">
<meta property="og:image" content="https://REPLACE-WITH-LIVE-DOMAIN.com/assets/img/hero1.webp">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/site.css">
</head>
<body>

<main id="main" class="wrap"></main>

<noscript>
  <p style="background:#2B2724;color:#fff;padding:16px;text-align:center;margin:0">
    This page needs JavaScript. Message us on
    <a href="https://wa.me/917567617393" style="color:#F3E4C6">WhatsApp</a> with the style number.
  </p>
</noscript>

<script src="assets/data.js"></script>
<script src="assets/app.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const sku  = new URLSearchParams(location.search).get('sku');
  const p    = sku ? bySku(sku) : null;
  const main = $('#main');

  if (!p){
    main.innerHTML = `
      <div class="empty">
        <h2>Style not found</h2>
        <p>That item isn't in the current collection.</p>
        <a class="btn btn--ink" href="index.html#shop">Back to shop</a>
      </div>`;
    return;
  }

  document.title = `${p.name} — ${BRAND.name}${BRAND.nameAccent}`;
  $('meta[name="description"]').setAttribute('content',
    `${p.name}. ${p.fabric}. ${money(p.price)}. Sizes ${p.sizes.join(', ')}.`);
  $('meta[property="og:title"]').setAttribute('content', p.name);

  const ld = document.createElement('script');
  ld.type = 'application/ld+json';
  ld.textContent = JSON.stringify({
    '@context':'https://schema.org','@type':'Product',
    sku:p.sku, name:p.name, description:p.desc, material:p.fabric,
    brand:{ '@type':'Brand', name:`${BRAND.name}${BRAND.nameAccent}` },
    offers:{ '@type':'Offer', priceCurrency:'INR', price:p.price,
             availability:'https://schema.org/InStock' }
  });
  document.head.appendChild(ld);

  let size   = p.sizes[0];
  let colour = p.colours[0];
  const off  = discount(p);
  const related = PRODUCTS.filter(x => x.sku !== p.sku && x.cat === p.cat).slice(0, 4);

  main.innerHTML = `
  <nav class="crumb">
    <a href="index.html">Home</a> / <a href="index.html#shop">Shop</a> / <span>${p.sku}</span>
  </nav>

  <div class="pdp">
    <div class="pdp__art">
      <picture>
        <source type="image/webp" srcset="${imgSet(p.img, 1000)}">
        <img src="assets/img/${p.img}-800.jpg" width="900" height="1350"
             alt="${p.name}" fetchpriority="high" decoding="async">
      </picture>
    </div>

    <div>
      <p class="eyebrow">${p.badge || CATEGORIES.find(c => c.id === p.cat)?.name || ''} · ${p.sku}</p>
      <h1>${p.name}</h1>

      <div class="pdp__price">
        <span class="pdp__now">${money(p.price)}</span>
        ${p.mrp > p.price ? `<span class="pdp__was">${money(p.mrp)}</span>
                             <span class="pdp__off">${off}% off</span>` : ''}
      </div>
      <p class="pdp__tax">Inclusive of all taxes${
        p.price >= BRAND.freeShipOver ? ' · Free shipping' : ''}</p>

      <p class="pdp__desc">${p.desc}</p>

      <div class="opt">
        <p class="opt__t">Colour <b id="cNow">${colour}</b></p>
        <div class="opts" id="cOpts">
          ${p.colours.map((c, i) => `<button data-c="${c}" aria-pressed="${!i}">${c}</button>`).join('')}
        </div>
      </div>

      <div class="opt">
        <p class="opt__t">Size <b id="sNow">${size}</b></p>
        <div class="opts" id="sOpts">
          ${p.sizes.map((s, i) => `<button data-s="${s}" aria-pressed="${!i}">${s}</button>`).join('')}
        </div>
      </div>

      <div class="opt">
        <p class="opt__t">Quantity</p>
        <div class="qty">
          <button id="less" aria-label="Decrease">−</button>
          <input id="qty" type="number" value="1" min="1" max="20" aria-label="Quantity">
          <button id="more" aria-label="Increase">+</button>
        </div>
      </div>

      <div class="pdp__act">
        <button class="btn btn--ink" id="addBtn">Add to cart</button>
        <a class="btn btn--wa" id="waBtn" href="${waProduct(p)}">${WA_GLYPH_SM} Ask on WhatsApp</a>
      </div>

      <dl class="pdp__meta">
        <div><dt>Fabric</dt><dd>${p.fabric}</dd></div>
        <div><dt>Includes</dt><dd>${p.pieces}</dd></div>
        <div><dt>Care</dt><dd>${p.care}</dd></div>
        <div><dt>Sizes</dt><dd>${p.sizes.join(' · ')}</dd></div>
        <div><dt>Delivery</dt><dd>3–5 working days${BRAND.codAvailable ? ' · COD available' : ''}</dd></div>
      </dl>
    </div>
  </div>

  ${related.length ? `
  <section style="padding:0 0 60px">
    <div class="sec__head">
      <div><p class="eyebrow">You may also like</p><h2>More from ${CATEGORIES.find(c => c.id === p.cat)?.name}</h2></div>
      <a class="sec__link" href="index.html#shop">View all →</a>
    </div>
    <div class="grid" id="rel">${related.map(cardHTML).join('')}</div>
  </section>` : ''}
  `;

  /* option pickers */
  const pick = (wrapSel, attr, onPick) => {
    $$(`${wrapSel} button`).forEach(b => b.addEventListener('click', () => {
      $$(`${wrapSel} button`).forEach(x => x.setAttribute('aria-pressed', 'false'));
      b.setAttribute('aria-pressed', 'true');
      onPick(b.dataset[attr]);
    }));
  };
  pick('#cOpts', 'c', v => { colour = v; $('#cNow').textContent = v; });
  pick('#sOpts', 's', v => { size   = v; $('#sNow').textContent = v; });

  const qty = $('#qty');
  const clamp = () => qty.value = Math.min(20, Math.max(1, parseInt(qty.value) || 1));
  $('#less').addEventListener('click', () => { qty.value = +qty.value - 1; clamp(); });
  $('#more').addEventListener('click', () => { qty.value = +qty.value + 1; clamp(); });
  qty.addEventListener('change', clamp);

  $('#addBtn').addEventListener('click', () => {
    Cart.add(p.sku, size, colour, +qty.value);
    toast(`${p.name} added to cart`);
  });

  wireQuickAdd($('#rel') || document);
});
</script>
</body>
</html>
